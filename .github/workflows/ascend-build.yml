name: ascend-build
on:
  push:
    branches: [ascend-face-ai]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ascend-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }

      - name: Baixar modelos MediaPipe e imagem de teste
        run: |
          mkdir -p app/src/main/assets app/src/androidTest/assets
          curl -fsSL -o app/src/main/assets/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          curl -fsSL -o app/src/main/assets/selfie_multiclass.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite
          curl -fsSL -o app/src/androidTest/assets/portrait.jpg https://storage.googleapis.com/mediapipe-assets/portrait.jpg
          ls -la app/src/main/assets app/src/androidTest/assets

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1 -q && chmod +x gradlew

      - name: Compilar APK e testes unitários
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build.log

      - name: Testes do backend
        id: backend
        if: always()
        run: node --experimental-strip-types --no-warnings backend/test/handler.test.ts 2>&1 | tee backend.log

      - name: Habilitar KVM
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Testes no emulador Android 14
        id: emu
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          disable-animations: true
          script: |
            adb shell getprop ro.product.cpu.abilist > abilist.txt || true
            adb logcat -c || true
            (adb logcat -v time AscendTest:I Ascend:V AndroidRuntime:E TestRunner:I *:S > logcat.txt &) ; ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --console=plain > emu.log 2>&1 ; echo "exit=$?" >> emu.log ; adb pull /sdcard/Android/data/com.ascend.faceai.debug/files/shots shots >> emu.log 2>&1 || true ; adb pull /sdcard/Android/data/com.ascend.faceai.debug/files/results results || true ; adb shell pm list packages | grep ascend >> emu.log || true

      - name: Publicar logs (branch ascend-ci-logs)
        if: always()
        run: |
          mkdir -p out && cd out
          cp ../build.log . 2>/dev/null || true; cp ../backend.log . 2>/dev/null || true
          cp ../emu.log ../abilist.txt . 2>/dev/null || true; cp ../logcat.txt . 2>/dev/null || true
          [ -f build.log ] && (grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -300 > build-errors.txt; tail -200 build.log > build-tail.txt; rm build.log) || true
          [ -f logcat.txt ] && tail -3000 logcat.txt > logcat-tail.txt && rm logcat.txt || true
          cp -r ../shots . 2>/dev/null || true; cp -r ../results . 2>/dev/null || true
          mkdir -p reports; cp -r ../app/build/reports/tests reports/unit 2>/dev/null || true
          cp -r ../app/build/reports/androidTests reports/android 2>/dev/null || true
          mkdir -p wrapper; cp ../gradlew ../gradlew.bat wrapper/ 2>/dev/null || true; cp ../gradle/wrapper/gradle-wrapper.jar wrapper/ 2>/dev/null || true
          ls -la ../app/build/outputs/apk/debug/ > apk-ls.txt 2>&1 || true
          echo "build=${{ steps.build.outcome }} backend=${{ steps.backend.outcome }} emu=${{ steps.emu.outcome }} sha=${{ github.sha }} run=${{ github.run_id }}" > status.txt
          git init -q && git checkout -q -b ascend-ci-logs && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "logs ${{ github.sha }} [skip ci]"
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ascend-ci-logs

      - name: Publicar APK (release ascend-latest)
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AscendFaceAI-debug.apk
          git archive --format=zip -o AscendFaceAI-source.zip HEAD
          zip -q AscendFaceAI-source.zip gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          gh release delete ascend-latest -y --cleanup-tag || true
          gh release create ascend-latest AscendFaceAI-debug.apk AscendFaceAI-source.zip --target ${{ github.sha }} --prerelease \
            --title "Ascend Face AI (debug) — build ${{ github.run_number }}" \
            --notes "APK de depuração instalável. Testes no emulador: ${{ steps.emu.outcome }}. Commit ${{ github.sha }}."
