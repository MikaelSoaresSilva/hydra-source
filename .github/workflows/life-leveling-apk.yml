name: Life Leveling — testes e APK

on:
  push:
    paths: ['life-leveling/**', '.github/workflows/life-leveling-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-leveling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: life-leveling/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: npm test
      - run: npm run build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LifeLeveling-apk
          path: life-leveling/android/app/build/outputs/apk/debug/app-debug.apk
